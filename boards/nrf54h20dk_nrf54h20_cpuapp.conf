# nRF54H20DK - Application core
#
# nRF54H20 does not have an integrated LTE modem.
# Connectivity options:
#   - nRF9160 as LTE modem companion (via UART AT commands)
#   - nRF7002 Wi-Fi companion chip
#   - Ethernet via external PHY
#
# For nRF9160 LTE companion (recommended for WAN):
# CONFIG_LTE_LINK_CONTROL=y
# CONFIG_MODEM_MODULES=y

CONFIG_ENTROPY_NRF5_RNG=y
