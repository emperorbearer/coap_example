# nRF54L15DK - Application core
#
# nRF54L15 does not have an integrated LTE modem or Ethernet.
# Connectivity options:
#   - OpenThread (IEEE 802.15.4) via a Thread border router
#   - Wi-Fi via nRF7002 companion chip
#   - USB CDC-ECM for development/testing
#
# Uncomment the relevant transport below.

# ── Option A: OpenThread (recommended for production) ──────────────────────────
# CONFIG_OPENTHREAD=y
# CONFIG_OPENTHREAD_MTD=y
# CONFIG_OPENTHREAD_MANUAL_START=n
# CONFIG_NET_L2_OPENTHREAD=y
# CONFIG_OPENTHREAD_CHANNEL=15
# CONFIG_OPENTHREAD_PANID=0xabcd
# CONFIG_OPENTHREAD_NETWORK_NAME="SCD40Net"
# CONFIG_OPENTHREAD_MASTERKEY="00112233445566778899aabbccddeeff"

# ── Option B: USB CDC-ECM (development/PC tethering) ──────────────────────────
# CONFIG_USB_DEVICE_STACK=y
# CONFIG_USB_CDC_ECM=y
# CONFIG_NET_L2_ETHERNET=y

# ── Common for nRF54L15 ────────────────────────────────────────────────────────
CONFIG_ENTROPY_NRF5_RNG=y
