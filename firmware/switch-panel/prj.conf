# --- Panel switch (battery-powered Thread SSED with buttons + rotary encoder) ---

# Networking + IPv6 + sockets
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y

# OpenThread MTD, Sleepy End Device for battery life.
# Low-power "sender-only" profile like the inner switch: CSL receive is left
# DISABLED (this panel only transmits; ACKs arrive right after our own TX). A
# long data-poll keep-alive stays attached; keep it below the child timeout.
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_JOINER=y
# CONFIG_OPENTHREAD_CSL_RECEIVER is not set
CONFIG_OPENTHREAD_POLL_PERIOD=120000
# See docs/hardware/power-budget.md for the battery-life analysis.

# CoAP client + CBOR
CONFIG_COAP=y
CONFIG_COAP_CLIENT=y
CONFIG_ZCBOR=y

# Persist binding records
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Input subsystem: buttons (gpio-keys) + rotary encoder (gpio-qdec)
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_INPUT_GPIO_QDEC=y

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# --- Optional e-paper status display ---
# The display code self-disables unless the board overlay chooses a
# `zephyr,display`. To fit an e-paper (e.g. SSD1680), apply the example overlay
# boards/epd-ssd1680.overlay.example and enable the options below:
# CONFIG_SPI=y
# CONFIG_DISPLAY=y
# CONFIG_CHARACTER_FRAMEBUFFER=y
# CONFIG_SSD16XX=y
# CONFIG_NEWLIB_LIBC=y   # or ensure snprintf/float-free formatting is available

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
