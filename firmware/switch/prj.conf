# --- Switch node (battery-powered Thread Sleepy End Device) ---

# Networking + IPv6 + sockets
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y

# OpenThread as a Minimal Thread Device, Sleepy End Device for battery life.
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_JOINER=y
# CSL (synchronized SED) keeps latency low while radio mostly sleeps.
CONFIG_OPENTHREAD_CSL_RECEIVER=y
CONFIG_OPENTHREAD_POLL_PERIOD=236000

# CoAP client (request/response helper)
CONFIG_COAP=y
CONFIG_COAP_CLIENT=y
CONFIG_ZCBOR=y

# Persist binding records (which light(s) this switch controls)
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# GPIO input (wall-switch dry contact) with interrupt/sense wake
CONFIG_GPIO=y

# Power management: deep sleep between events
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Logging (disable or lower in production for power)
CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
