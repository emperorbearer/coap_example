# --- Light node (mains-powered Thread FTD/Router) ---

# Networking + IPv6
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y

# OpenThread as the L2 (portable across nRF / EFR32 / ESP32)
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_MANUAL_START=n
# Preconfigured network for bring-up; replace with commissioning in production.
CONFIG_OPENTHREAD_JOINER=y
CONFIG_OPENTHREAD_SRP_CLIENT=y

# CoAP server subsystem (handles sockets, resources, observe)
CONFIG_COAP=y
CONFIG_COAP_SERVER=y
CONFIG_COAP_SERVER_WELL_KNOWN_CORE=y
CONFIG_COAP_SERVICE_OBSERVE=y
CONFIG_COAP_OBSERVER_MAX_PER_RESOURCE=4

# CBOR payloads
CONFIG_ZCBOR=y

# Persist last light state across reboots
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# GPIO for relay/LED/button, PWM for the RGBW LED channels
CONFIG_GPIO=y
CONFIG_PWM=y

# Logging
CONFIG_LOG=y
CONFIG_NET_LOG=y

# Reasonable stack/heap for the networking + CoAP workload
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
