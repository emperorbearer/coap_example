# ─── Kernel ───────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ─── Logging ──────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y

# ─── I2C (for SCD40) ──────────────────────────────────────────────────────────
CONFIG_I2C=y

# ─── Networking ───────────────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y

# Auto-configure networking (DHCP for Ethernet, etc.)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_DHCPV4=y

# ─── CoAP ─────────────────────────────────────────────────────────────────────
CONFIG_COAP=y

# ─── LWM2M ────────────────────────────────────────────────────────────────────
CONFIG_LWM2M=y
CONFIG_LWM2M_ENGINE_MAX_MESSAGES=20
CONFIG_LWM2M_ENGINE_MAX_PENDING=10
CONFIG_LWM2M_ENGINE_MAX_REPLIES=10
CONFIG_LWM2M_COAP_BLOCK_SIZE=512
CONFIG_LWM2M_ENGINE_DEFAULT_LIFETIME=120
CONFIG_LWM2M_RD_CLIENT_SUPPORT=y
CONFIG_LWM2M_RD_CLIENT_SUPPORT_BOOTSTRAP=n
CONFIG_LWM2M_LOG_LEVEL_INF=y

# LWM2M Device object (Object 3) metadata
CONFIG_LWM2M_DEVICE_MANUFACTURER="Nordic/Sensirion"
CONFIG_LWM2M_DEVICE_MODEL_NUMBER="nRF54-SCD40"
CONFIG_LWM2M_DEVICE_SERIAL_NUMBER="SCD40-001"
CONFIG_LWM2M_DEVICE_FIRMWARE_VERSION="1.0.0"
CONFIG_LWM2M_DEVICE_TYPE="AirQualityMonitor"
CONFIG_LWM2M_DEVICE_HARDWARE_VERSION="1.0"
CONFIG_LWM2M_DEVICE_SOFTWARE_VERSION="1.0.0"

# IPSO sensor objects
CONFIG_LWM2M_IPSO_SUPPORT=y
CONFIG_LWM2M_IPSO_TEMP_SENSOR=y       # Object 3303 - Temperature
CONFIG_LWM2M_IPSO_HUMIDITY_SENSOR=y   # Object 3304 - Humidity
CONFIG_LWM2M_IPSO_GENERIC_SENSOR=y    # Object 3300 - Generic (CO2 in ppm)

# ─── DNS ──────────────────────────────────────────────────────────────────────
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="nrf54-scd40"

# ─── Misc ─────────────────────────────────────────────────────────────────────
CONFIG_REBOOT=y
CONFIG_POSIX_API=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
